[theme]
primaryColor = "#4f46e5"
base = "light"

[server]
maxUploadSize = 5
# PyTorch (pulled in by sentence-transformers) trips Streamlit's module-path
# watcher and spams a harmless "torch.classes ... __path__._path" traceback.
# The watcher only powers dev hot-reload, so disabling it silences the noise
# without affecting how the app runs. Set to "auto" if you want hot-reload back.
fileWatcherType = "none"
